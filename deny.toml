# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
# Fail on known vulnerabilities; unmaintained crates are reported for review.
yanked = "deny"
# serde_yaml 0.9 is archived upstream; replacement is tracked in docs/ROADMAP.md.
ignore = []

[licenses]
# Permissive licenses only for dependencies. (Kill Line's own license is not yet decided.)
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies between workspace crates are fine (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
