name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libbpf-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Validate bundled policies
        run: for p in policies/*.yaml test-lab/no-network.yaml; do ./target/release/killline --no-color validate-policy "$p"; done
      - name: Engine throughput
        run: cargo run --release --locked -p killline-core --example engine_bench 100000

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libbpf-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build .deb and AppImage
        run: desktop/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: killline-desktop
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint (Windows build)
        run: cargo clippy -p killline-core -p killline-sensor -p killline-cli --all-targets --locked -- -D warnings
      - name: Unit and scenario tests
        run: cargo test -p killline-core --locked
      - name: Build the engine
        run: cargo build --release --locked -p killline-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ETW smoke test (runner is Administrator)
        env:
          KILLLINE_ETW_PROBE: "1"
        run: python scripts/windows_smoke.py target\release\killline.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: killline-windows-cli
          path: target/release/killline.exe

  desktop-windows:
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installers (NSIS + MSI)
        shell: pwsh
        run: desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kill-line-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
