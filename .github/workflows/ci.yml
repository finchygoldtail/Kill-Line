name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libbpf-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Validate bundled policies
        run: for p in policies/*.yaml test-lab/no-network.yaml; do ./target/release/killline --no-color validate-policy "$p"; done
      - name: Engine throughput
        run: cargo run --release --locked -p killline-core --example engine_bench 100000

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
