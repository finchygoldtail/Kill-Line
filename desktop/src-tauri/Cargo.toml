[package]
name = "killline-desktop"
version = "0.1.0"
description = "KillLine desktop app: the KillLine dashboard in a native window"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
