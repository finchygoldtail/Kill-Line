[workspace]
resolver = "2"
members = ["crates/killline-core", "crates/killline-sensor", "crates/killline-cli"]
# The desktop app (Tauri) needs GTK/WebKit dev libraries; it is built separately.
exclude = ["desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
